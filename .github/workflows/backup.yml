# Nightly encrypted backup of the TeachFormosa database (and, optionally, uploaded files).
# Result: an encrypted file kept for 90 days under Actions -> "Nightly backup" -> the run -> Artifacts.
# Needs two repository secrets (Settings -> Secrets and variables -> Actions):
#   DB_URL             Supabase "Session pooler" connection string (with the database password filled in)
#   BACKUP_PASSPHRASE  a long random passphrase (at least 20 characters). Keep a copy somewhere safe: without it a backup cannot be opened.
# Optional (adds teacher photos and school proof documents to the backup):
#   SUPABASE_URL, SUPABASE_SERVICE_KEY
# If a run fails, GitHub emails the repository owner.
name: Nightly backup

on:
  schedule:
    - cron: '17 19 * * *'   # 03:17 Taipei time every night
  workflow_dispatch: {}      # lets you press "Run workflow" for a backup right now

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install PostgreSQL 17 client
        run: |
          sudo apt-get install -y curl ca-certificates gnupg
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install -y postgresql-client-17

      - name: Dump database
        env:
          DB_URL: ${{ secrets.DB_URL }}
        run: |
          set -euo pipefail
          test -n "$DB_URL" || { echo "Secret DB_URL is missing"; exit 1; }
          mkdir -p backup
          # All site data and settings (tables, functions, policies).
          pg_dump "$DB_URL" --no-owner --no-privileges --schema=public -Fc -f backup/public.dump
          # The login accounts (emails and password hashes) so people do not have to register again.
          pg_dump "$DB_URL" --data-only --no-owner --table=auth.users --table=auth.identities -f backup/auth-logins.sql
          # Sanity check: a tiny file means something went wrong.
          test "$(stat -c %s backup/public.dump)" -gt 20000

      - name: Download uploaded files (optional)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          if [ -n "$SUPABASE_URL" ] && [ -n "$SUPABASE_SERVICE_KEY" ]; then
            node scripts/backup-storage.mjs backup/files
          else
            echo "SUPABASE_URL / SUPABASE_SERVICE_KEY not set: skipping uploaded files."
          fi

      - name: Pack and encrypt
        env:
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          set -euo pipefail
          test "${#BACKUP_PASSPHRASE}" -ge 20 || { echo "BACKUP_PASSPHRASE must be at least 20 characters"; exit 1; }
          STAMP=$(date -u +%Y-%m-%d)
          tar -czf "teachformosa-$STAMP.tar.gz" backup
          gpg --batch --yes --pinentry-mode loopback --symmetric --cipher-algo AES256 --passphrase "$BACKUP_PASSPHRASE" -o "teachformosa-$STAMP.tar.gz.gpg" "teachformosa-$STAMP.tar.gz"
          rm -rf backup "teachformosa-$STAMP.tar.gz"
          ls -l

      - uses: actions/upload-artifact@v4
        with:
          name: teachformosa-backup
          path: teachformosa-*.tar.gz.gpg
          retention-days: 90
          if-no-files-found: error
