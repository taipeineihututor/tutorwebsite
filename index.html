<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TeachFormosa – Teaching Jobs & Teacher Profiles</title>
    <meta name="description" content="Find English teaching jobs in Taiwan, or create a teacher profile and let schools find you." />
    <meta name="theme-color" content="#1D3A8C" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%23FFCE1F'/%3E%3Cpath d='M18.7 5.1 L19.9 6.2 L21.4 7.1 L20.9 8.0 L20.7 9.6 L19.2 13.5 L17.8 19.3 L16.4 21.5 L15.0 24.1 L14.7 27.0 L13.8 26.4 L13.2 24.1 L11.3 22.5 L10.6 19.9 L10.6 17.0 L10.6 15.4 L12.9 11.6 L15.0 8.3 L15.9 6.7 L17.9 5.9Z' fill='%230A1745' stroke='%230A1745' stroke-width='.7' stroke-linejoin='round'/%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Load the font without blocking the page: a slow or unreachable Google Fonts must never leave the site blank. -->
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;900&display=swap" onload="this.onload=null;this.rel='stylesheet'" />
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;900&display=swap" /></noscript>
    <script>
      // Safety net: if the site has not started after 8 seconds, reload once; if it still has not, say so instead of staying blank.
      (function () {
        var errs = [];
        window.addEventListener('error', function (e) { errs.push(String((e && (e.message || e.error)) || 'error')); });
        window.addEventListener('unhandledrejection', function (e) { errs.push(String(e && e.reason && (e.reason.message || e.reason))); });
        setTimeout(function () {
          var boot = document.getElementById('tf-boot');
          if (!boot) return; // the site started normally
          try {
            if (!sessionStorage.getItem('tf_boot_retry')) { sessionStorage.setItem('tf_boot_retry', '1'); location.reload(); return; }
          } catch (e) { /* ignore */ }
          boot.innerHTML = '<p style="font-weight:900;font-size:20px">TeachFormosa could not start.</p>' +
            '<p style="margin:8px 0 16px">Please check your connection and reload the page.</p>' +
            '<button onclick="try{sessionStorage.removeItem(\'tf_boot_retry\')}catch(e){};location.reload()" style="background:#FFCE1F;color:#0A1745;font-weight:800;border:0;border-radius:10px;padding:10px 18px;cursor:pointer">Reload</button>' +
            (errs.length ? '<p style="margin-top:16px;font-size:12px;opacity:.7">' + errs.slice(0, 2).join(' | ').replace(/</g, '&lt;') + '</p>' : '');
        }, 8000);
      })();
    </script>
  </head>
  <body class="bg-[#1D3A8C] text-slate-900 antialiased font-sans">
    <div id="root"><div id="tf-boot" style="color:#fff;font-family:Roboto,Arial,sans-serif;text-align:center;padding:30vh 24px 0">Loading TeachFormosa…</div></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
